<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Habit Tracker</title>
  
  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="theme-color" content="#09090b">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* iOS Momentum Scrolling & Native Tweaks */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .safe-top { padding-top: max(env(safe-area-inset-top), 24px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 24px); }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar { display: none; }
    
    /* Completion check animation */
    @keyframes bounce-scale {
      0% { transform: scale(1); }
      50% { transform: scale(0.88); }
      100% { transform: scale(1); }
    }
    .animate-tap {
      animation: bounce-scale 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>
<body class="bg-[#09090b] text-neutral-100 min-h-screen flex flex-col justify-between selection:bg-neutral-800">

  <!-- Header -->
  <header class="safe-top px-6 pt-4 pb-2 sticky top-0 z-30 bg-[#09090b]/80 backdrop-blur-xl border-b border-neutral-900">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div>
        <p id="currentDate" class="text-xs uppercase tracking-wider font-semibold text-neutral-400">TODAY</p>
        <h1 class="text-2xl font-bold tracking-tight text-white">Habits</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold text-xl active:scale-90 transition-transform shadow-lg shadow-white/10">
          <i data-lucide="plus" class="w-5 h-5 text-black"></i>
        </button>
      </div>
    </div>

    <!-- 7-Day Mini Calendar Strip -->
    <div id="weekStrip" class="flex justify-between items-center max-w-md mx-auto mt-4 pt-1 pb-2">
      <!-- Injected via JavaScript -->
    </div>
  </header>

  <!-- Main Habit Content -->
  <main class="flex-1 px-6 py-4 max-w-md mx-auto w-full">
    <!-- Progress Banner -->
    <div class="bg-neutral-900/60 border border-neutral-800 rounded-2xl p-4 mb-6 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-medium text-neutral-400">Today's Progress</span>
        <span id="progressPercent" class="text-xs font-semibold text-white">0%</span>
      </div>
      <div class="w-full bg-neutral-800 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- Habit List -->
    <div id="habitList" class="space-y-3">
      <!-- Habit cards will be injected here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-neutral-900 border border-neutral-800 flex items-center justify-center">
        <i data-lucide="sparkles" class="w-8 h-8 text-neutral-500"></i>
      </div>
      <h3 class="text-lg font-semibold text-neutral-200">No habits added yet</h3>
      <p class="text-sm text-neutral-500 mt-1 max-w-xs mx-auto">Tap the plus button above to create your first daily habit.</p>
    </div>
  </main>

  <!-- Bottom Safe Area Spacer -->
  <footer class="safe-bottom py-2 text-center text-[11px] text-neutral-600">
    Offline-first • Saved to local storage
  </footer>

  <!-- Add Habit Modal -->
  <div id="habitModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-[#121215] border border-neutral-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl safe-bottom">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-bold text-white">New Habit</h2>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="addHabitForm" onsubmit="handleCreateHabit(event)">
        <div class="mb-4">
          <label class="block text-xs font-medium text-neutral-400 mb-1.5">HABIT NAME</label>
          <input id="habitNameInput" type="text" placeholder="e.g. Read 20 mins, Workout" required
            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-500 transition-colors">
        </div>

        <div class="mb-6">
          <label class="block text-xs font-medium text-neutral-400 mb-1.5">ICON / EMOJI</label>
          <div class="flex gap-2 items-center">
            <input id="habitEmojiInput" type="text" maxlength="2" value="⚡️" required
              class="w-16 text-center text-2xl bg-neutral-900 border border-neutral-800 rounded-xl py-2 text-white focus:outline-none focus:border-neutral-500">
            <span class="text-xs text-neutral-500">Pick any emoji as an icon</span>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-white text-black font-semibold rounded-xl active:scale-[0.98] transition-transform">
          Create Habit
        </button>
      </form>
    </div>
  </div>

  <script>
    // State Management
    let habits = JSON.parse(localStorage.getItem('habits_data') || '[]');
    let selectedDate = new Date().toISOString().split('T')[0];

    // Format Date string
    function formatDate(d) {
      const date = new Date(d);
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function initHeaderDate() {
      const today = new Date();
      document.getElementById('currentDate').innerText = today.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });
    }

    // Render 7-day strip
    function renderWeekStrip() {
      const container = document.getElementById('weekStrip');
      container.innerHTML = '';
      const today = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const iso = d.toISOString().split('T')[0];
        const isToday = iso === new Date().toISOString().split('T')[0];
        const isSelected = iso === selectedDate;

        const dayName = d.toLocaleDateString('en-US', { weekday: 'narrow' });
        const dayNum = d.getDate();

        const btn = document.createElement('button');
        btn.onclick = () => { selectedDate = iso; render(); };
        btn.className = `flex flex-col items-center justify-center w-11 h-14 rounded-2xl transition-all ${
          isSelected 
            ? 'bg-white text-black font-semibold shadow-md' 
            : 'bg-neutral-900/60 text-neutral-400 hover:text-white border border-neutral-800/80'
        }`;

        btn.innerHTML = `
          <span class="text-[10px] uppercase mb-0.5">${dayName}</span>
          <span class="text-sm font-bold">${dayNum}</span>
        `;
        container.appendChild(btn);
      }
    }

    // Calculate Habit Streak
    function calculateStreak(logs) {
      if (!logs || logs.length === 0) return 0;
      const sortedDates = [...new Set(logs)].sort().reverse();
      
      let streak = 0;
      let checkDate = new Date();
      
      // If not completed today, start checking from yesterday
      const todayStr = checkDate.toISOString().split('T')[0];
      if (!sortedDates.includes(todayStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
      }

      while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (sortedDates.includes(dateStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    // Save to LocalStorage
    function saveHabits() {
      localStorage.setItem('habits_data', JSON.stringify(habits));
    }

    // Toggle Habit Status
    function toggleHabit(habitId) {
      habits = habits.map(h => {
        if (h.id === habitId) {
          const logs = h.logs || [];
          const exists = logs.includes(selectedDate);
          const newLogs = exists 
            ? logs.filter(d => d !== selectedDate) 
            : [...logs, selectedDate];
          return { ...h, logs: newLogs };
        }
        return h;
      });
      saveHabits();
      render();
    }

    // Delete Habit
    function deleteHabit(habitId, e) {
      e.stopPropagation();
      if (confirm('Delete this habit?')) {
        habits = habits.filter(h => h.id !== habitId);
        saveHabits();
        render();
      }
    }

    // Render Habits
    function render() {
      renderWeekStrip();
      const listEl = document.getElementById('habitList');
      const emptyEl = document.getElementById('emptyState');
      listEl.innerHTML = '';

      if (habits.length === 0) {
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
      }

      let completedCount = 0;

      habits.forEach(habit => {
        const isDone = (habit.logs || []).includes(selectedDate);
        if (isDone) completedCount++;
        const streak = calculateStreak(habit.logs || []);

        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-4 rounded-2xl border transition-all cursor-pointer ${
          isDone 
            ? 'bg-neutral-900/80 border-emerald-500/40 text-neutral-100' 
            : 'bg-neutral-900/40 border-neutral-800 text-neutral-300'
        }`;
        card.onclick = () => toggleHabit(habit.id);

        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <span class="text-2xl">${habit.emoji || '⚡️'}</span>
            <div>
              <h4 class="font-semibold text-sm ${isDone ? 'line-through text-neutral-400' : 'text-white'}">${habit.name}</h4>
              <div class="flex items-center gap-1 text-[11px] text-neutral-400 mt-0.5">
                <i data-lucide="flame" class="w-3.5 h-3.5 text-amber-500"></i>
                <span>${streak} day streak</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="deleteHabit('${habit.id}', event)" class="text-neutral-500 hover:text-red-400 p-1 rounded-lg">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <div class="w-8 h-8 rounded-full border flex items-center justify-center transition-all ${
              isDone 
                ? 'bg-emerald-500 border-emerald-400 text-black animate-tap' 
                : 'border-neutral-700 bg-neutral-800/40'
            }">
              ${isDone ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
            </div>
          </div>
        `;

        listEl.appendChild(card);
      });

      // Update Progress Bar
      const total = habits.length;
      const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);
      document.getElementById('progressPercent').innerText = `${percentage}%`;
      document.getElementById('progressBar').style.width = `${percentage}%`;

      lucide.createIcons();
    }

    // Modal controls
    function openModal() {
      document.getElementById('habitModal').classList.remove('hidden');
      document.getElementById('habitModal').classList.add('flex');
      document.getElementById('habitNameInput').focus();
    }

    function closeModal() {
      document.getElementById('habitModal').classList.add('hidden');
      document.getElementById('habitModal').classList.remove('flex');
      document.getElementById('addHabitForm').reset();
    }

    function handleCreateHabit(e) {
      e.preventDefault();
      const name = document.getElementById('habitNameInput').value.trim();
      const emoji = document.getElementById('habitEmojiInput').value.trim() || '⚡️';
      if (!name) return;

      const newHabit = {
        id: 'h_' + Date.now(),
        name,
        emoji,
        logs: [],
        createdAt: new Date().toISOString()
      };

      habits.push(newHabit);
      saveHabits();
      closeModal();
      render();
    }

    // Initial Load
    initHeaderDate();
    render();
  </script>
</body>
</html>
